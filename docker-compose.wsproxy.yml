services:
  wsproxy:
    image: ${WSPROXY_IMAGE:-wsproxy:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: wsproxy
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
      - "127.0.0.1:11451:11451"
    volumes:
      - ${WSPROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${WSPROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${WSPROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${WSPROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped
